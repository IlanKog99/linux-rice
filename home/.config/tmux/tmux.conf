# ============================================================================
#  tmux — Catppuccin Mocha
# ============================================================================

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell /usr/bin/zsh

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# Prefix: Ctrl+a (Ctrl+b is awkward)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits that keep the current directory, with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "  reloaded"

# Pane navigation with Alt+arrows, no prefix
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---- Catppuccin Mocha palette ----------------------------------------------
%hidden base="#1e1e2e"
%hidden mantle="#181825"
%hidden surface0="#313244"
%hidden surface1="#45475a"
%hidden overlay0="#6c7086"
%hidden text="#cdd6f4"
%hidden subtext="#a6adc8"
%hidden mauve="#cba6f7"
%hidden blue="#89b4fa"
%hidden green="#a6e3a1"
%hidden peach="#fab387"
%hidden red="#f38ba8"
%hidden lavender="#b4befe"

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#{mantle},fg=#{text}"

set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[fg=#{base},bg=#{mauve},bold]  #S #[fg=#{mauve},bg=#{mantle}]"
set -g status-right "#[fg=#{surface0},bg=#{mantle}]#[fg=#{lavender},bg=#{surface0}] 󰃰 %Y-%m-%d  %H:%M #[fg=#{blue},bg=#{surface0}]#[fg=#{base},bg=#{blue},bold]  #h "

setw -g window-status-format "#[fg=#{mantle},bg=#{surface0}]#[fg=#{subtext},bg=#{surface0}] #I  #W #[fg=#{surface0},bg=#{mantle}]"
setw -g window-status-current-format "#[fg=#{mantle},bg=#{green}]#[fg=#{base},bg=#{green},bold] #I  #W #[fg=#{green},bg=#{mantle}]"
setw -g window-status-separator " "

set -g pane-border-style "fg=#{surface1}"
set -g pane-active-border-style "fg=#{mauve}"
set -g pane-border-lines heavy

set -g message-style "bg=#{surface0},fg=#{peach},bold"
set -g message-command-style "bg=#{surface0},fg=#{peach}"
setw -g mode-style "bg=#{surface1},fg=#{lavender},bold"
set -g display-panes-active-colour "#{mauve}"
set -g display-panes-colour "#{overlay0}"
